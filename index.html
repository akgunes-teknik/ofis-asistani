<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ofis Asistanı">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Ofis Asistanı</title>
<style>
  html, body { margin: 0; height: 100%; background: #1f4e79; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  #yuk { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
         color: #fff; font: 600 18px system-ui, sans-serif; gap: 14px; }
  #yuk img { width: 96px; height: 96px; }
  #ayarYok { display: none; padding: 24px; color: #fff; font: 16px system-ui, sans-serif; }
</style>
</head>
<body>
<div id="yuk"><img src="icon-192.png" alt=""><span>Ofis Asistanı açılıyor…</span></div>
<div id="ayarYok">Uygulama adresi yazılmamış. GitHub'da index.html içindeki <b>UYGULAMA</b> satırına Apps Script /exec adresini yapıştırın.</div>
<iframe id="app" title="Ofis Asistanı"
        allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen; web-share"></iframe>
<script>
  // ===== TEK DEĞİŞTİRİLECEK SATIR: Apps Script web uygulamasının /exec adresi =====
  const UYGULAMA = 'BURAYA_EXEC_ADRESINI_YAPISTIRIN';
  // =================================================================================
  const f = document.getElementById('app');
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(UYGULAMA)) {
    document.getElementById('yuk').style.display = 'none';
    document.getElementById('ayarYok').style.display = 'block';
  } else {
    f.src = UYGULAMA + location.search;   // QR bağlantısı parametreleri (mesaiqr, k) uygulamaya geçer
    f.addEventListener('load', () => { const y = document.getElementById('yuk'); if (y) y.remove(); });
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
